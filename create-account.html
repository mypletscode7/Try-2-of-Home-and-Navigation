<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MYP Haven | Create Account</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #8B5CF6;

            font-family: "DM Sans", sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .account-container {
            width: 100%;
            max-width: 850px;

            background: #FFFFFF;

            border-radius: 30px;

            padding: 55px;

            text-align: left;
        }

        .title {
            font-size: clamp(2.5rem, 6vw, 4.5rem);

            font-weight: 700;

            line-height: 1;

            color: #8B5CF6;

            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 1rem;

            font-weight: 700;

            color: #222222;
        }

        .form-group input {
            width: 100%;

            height: 55px;

            padding: 0 18px;

            border: 2px solid #E5E5E5;

            border-radius: 14px;

            outline: none;

            font-family: "DM Sans", sans-serif;

            font-size: 1rem;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .form-group input:focus {
            border-color: #8B5CF6;

            box-shadow:
                0 0 0 4px rgba(139, 92, 246, 0.12);
        }

        .agreement {
            display: flex;

            align-items: flex-start;

            gap: 10px;

            margin: 25px 0;
        }

        .agreement input {
            width: 18px;
            height: 18px;

            margin-top: 3px;

            accent-color: #8B5CF6;
        }

        .agreement label {
            font-size: 0.9rem;

            line-height: 1.5;

            color: #444444;
        }

        .create-button {
            width: 100%;

            height: 58px;

            border: none;

            border-radius: 999px;

            background: #8B5CF6;

            color: #FFFFFF;

            font-family: "DM Sans", sans-serif;

            font-size: 1rem;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .create-button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 10px 25px rgba(139, 92, 246, 0.25);
        }

        .create-button:active {
            transform: scale(0.98);
        }

        .login-button {
            display: block;

            width: 100%;

            height: 50px;

            margin-top: 15px;

            border: none;

            border-radius: 999px;

            background: #F1ECFF;

            color: #8B5CF6;

            font-family: "DM Sans", sans-serif;

            font-size: 0.95rem;

            font-weight: 700;

            cursor: pointer;
        }

        .error-message {
            display: none;

            margin-bottom: 20px;

            padding: 14px 18px;

            border-radius: 12px;

            background: #FFE5EA;

            color: #C6284A;

            font-size: 0.9rem;

            font-weight: 600;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .account-container {
                padding: 35px 25px;

                border-radius: 22px;
            }

            .title {
                font-size: 2.7rem;
            }

        }

    </style>

</head>

<body>

    <main class="account-container">

        <h1 class="title">
            Create your MYP Haven account
        </h1>

        <div
            class="error-message"
            id="error-message"
        ></div>

        <form id="create-account-form">

            <div class="form-group">

                <label for="full-name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="full-name"
                    name="fullName"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirm-password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >

            </div>


            <div class="agreement">

                <input
                    type="checkbox"
                    id="agreement"
                    required
                >

                <label for="agreement">
                    I agree to MYP Haven's Terms & Privacy Policy.
                </label>

            </div>


            <button
                type="submit"
                class="create-button"
            >
                Create Account
            </button>


            <button
                type="button"
                class="login-button"
                onclick="window.location.href='login.html'"
            >
                Already have an account? Log in
            </button>

        </form>

    </main>


    <script>

        const form =
            document.getElementById(
                "create-account-form"
            );

        const password =
            document.getElementById(
                "password"
            );

        const confirmPassword =
            document.getElementById(
                "confirm-password"
            );

        const errorMessage =
            document.getElementById(
                "error-message"
            );


        form.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                /*
                    Check that both passwords
                    match before continuing.
                */

                if (
                    password.value !==
                    confirmPassword.value
                ) {

                    errorMessage.textContent =
                        "Your passwords do not match.";

                    errorMessage.style.display =
                        "block";

                    return;
                }


                /*
                    Temporarily store the name.
                    We will connect this page
                    to Firebase next.
                */

                localStorage.setItem(
                    "mypHavenFullName",
                    document.getElementById(
                        "full-name"
                    ).value
                );


                /*
                    For now, continue to the
                    survey page.
                */

                window.location.href =
                    "survey.html";

            }
        );

    </script>

</body>

</html>
