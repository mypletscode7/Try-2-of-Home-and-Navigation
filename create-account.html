<style>

    /* =====================================================
       GLOBAL
    ====================================================== */

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        min-height: 100vh;

        background: #8B5CF6;

        font-family: "DM Sans", sans-serif;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 30px;

        color: #222222;
    }


    /* =====================================================
       MAIN CONTAINER
    ====================================================== */

    .account-container {

        width: 100%;
        max-width: 850px;

        background: #FFFFFF;

        border-radius: 30px;

        padding: 55px 65px;

        box-shadow:
            0 25px 70px rgba(0, 0, 0, 0.18);
    }


    /* =====================================================
       HEADER
    ====================================================== */

    .header {
        text-align: center;

        margin-bottom: 45px;
    }

    .logo {
        width: 105px;

        max-width: 100%;

        margin-bottom: 25px;
    }

    .title {
        font-size: clamp(2.2rem, 5vw, 3.8rem);

        line-height: 1;

        font-weight: 700;

        color: #222222;

        margin-bottom: 12px;
    }

    .subtitle {
        font-size: 1rem;

        color: #666666;

        font-weight: 500;
    }


    /* =====================================================
       FORM
    ====================================================== */

    .form {

        display: flex;

        flex-direction: column;

        gap: 22px;
    }

    .form-group {

        display: flex;

        flex-direction: column;

        gap: 8px;
    }

    .form-label {

        font-size: 0.95rem;

        font-weight: 700;

        color: #222222;
    }

    .required {
        color: #8B5CF6;
    }

    .form-input {

        width: 100%;

        height: 58px;

        padding: 0 18px;

        border: 2px solid #E5E5E5;

        border-radius: 15px;

        outline: none;

        background: #FFFFFF;

        font-family: "DM Sans", sans-serif;

        font-size: 1rem;

        color: #222222;

        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease;
    }

    .form-input:focus {

        border-color: #8B5CF6;

        box-shadow:
            0 0 0 4px rgba(139, 92, 246, 0.12);
    }

    .form-input.error {

        border-color: #FF4D6D;
    }


    /* =====================================================
       PASSWORD MESSAGE
    ====================================================== */

    .password-message {

        font-size: 0.82rem;

        color: #777777;

        line-height: 1.4;
    }


    /* =====================================================
       CHECKBOX
    ====================================================== */

    .agreement {

        display: flex;

        align-items: flex-start;

        gap: 12px;

        margin-top: 5px;
    }

    .agreement input {

        width: 19px;

        height: 19px;

        min-width: 19px;

        margin-top: 2px;

        accent-color: #8B5CF6;

        cursor: pointer;
    }

    .agreement label {

        font-size: 0.9rem;

        line-height: 1.5;

        color: #555555;

        cursor: pointer;
    }

    .agreement a {

        color: #8B5CF6;

        font-weight: 700;

        text-decoration: none;
    }

    .agreement a:hover {

        text-decoration: underline;
    }


    /* =====================================================
       ERROR MESSAGE
    ====================================================== */

    .error-message {

        display: none;

        padding: 13px 16px;

        border-radius: 12px;

        background: #FFF0F3;

        color: #D92D4C;

        font-size: 0.9rem;

        font-weight: 600;

        line-height: 1.4;
    }

    .error-message.show {

        display: block;
    }


    /* =====================================================
       SUCCESS MESSAGE
    ====================================================== */

    .success-message {

        display: none;

        padding: 15px 18px;

        border-radius: 12px;

        background: #ECFDF5;

        color: #15803D;

        font-size: 0.9rem;

        font-weight: 600;

        line-height: 1.4;
    }

    .success-message.show {

        display: block;
    }


    /* =====================================================
       BUTTONS
    ====================================================== */

    .create-button {

        width: 100%;

        height: 60px;

        border: none;

        border-radius: 16px;

        background: #8B5CF6;

        color: #FFFFFF;

        font-family: "DM Sans", sans-serif;

        font-size: 1rem;

        font-weight: 700;

        cursor: pointer;

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease,
            opacity 0.2s ease;

        margin-top: 5px;
    }

    .create-button:hover {

        transform: translateY(-3px);

        box-shadow:
            0 12px 25px rgba(139, 92, 246, 0.25);
    }

    .create-button:active {

        transform: scale(0.98);
    }

    .create-button:disabled {

        cursor: not-allowed;

        opacity: 0.65;

        transform: none;

        box-shadow: none;
    }


    .login-button {

        width: 100%;

        height: 52px;

        border: none;

        border-radius: 15px;

        background: #F3F0FF;

        color: #8B5CF6;

        font-family: "DM Sans", sans-serif;

        font-size: 0.95rem;

        font-weight: 700;

        cursor: pointer;

        transition:
            transform 0.2s ease,
            background 0.2s ease;
    }

    .login-button:hover {

        transform: translateY(-2px);

        background: #EAE3FF;
    }


    /* =====================================================
       DIVIDER
    ====================================================== */

    .divider {

        display: flex;

        align-items: center;

        gap: 15px;

        margin: 5px 0;
    }

    .divider-line {

        flex: 1;

        height: 1px;

        background: #E5E5E5;
    }

    .divider-text {

        font-size: 0.8rem;

        color: #999999;

        font-weight: 600;
    }


    /* =====================================================
       LOADING
    ====================================================== */

    .loading {

        display: inline-flex;

        align-items: center;

        justify-content: center;

        gap: 9px;
    }

    .spinner {

        width: 17px;

        height: 17px;

        border: 2px solid rgba(255, 255, 255, 0.4);

        border-top-color: #FFFFFF;

        border-radius: 50%;

        animation: spin 0.7s linear infinite;
    }

    @keyframes spin {

        to {
            transform: rotate(360deg);
        }

    }


    /* =====================================================
       RESPONSIVE
    ====================================================== */

    @media (max-width: 700px) {

        body {

            padding: 18px;

            align-items: flex-start;
        }

        .account-container {

            margin-top: 20px;

            padding: 40px 25px;

            border-radius: 24px;
        }

        .title {

            font-size: 2.35rem;
        }

        .header {

            margin-bottom: 35px;
        }

    }


    @media (max-width: 420px) {

        .account-container {

            padding: 35px 20px;
        }

        .form-input {

            height: 54px;
        }

        .create-button {

            height: 56px;
        }

    }


    /* =====================================================
       ACCESSIBILITY
    ====================================================== */

    @media (prefers-reduced-motion: reduce) {

        * {

            animation-duration: 0.01ms !important;

            animation-iteration-count: 1 !important;

            transition-duration: 0.01ms !important;
        }

    }

</style>

<main class="account-container">


    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="header">

        <img
            src="logo.png"
            alt="MYP Haven Logo"
            class="logo"
        >

        <h1 class="title">
            Create your MYP Haven account
        </h1>

        <p class="subtitle">
            Create your account to begin your MYP journey.
        </p>

    </header>


    <!-- =================================================
         ACCOUNT FORM
    ================================================== -->

    <form
        class="form"
        id="create-account-form"
    >


        <!-- FULL NAME -->

        <div class="form-group">

            <label
                class="form-label"
                for="full-name"
            >
                Full Name <span class="required">*</span>
            </label>

            <input
                class="form-input"
                type="text"
                id="full-name"
                name="full-name"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >

        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label
                class="form-label"
                for="email"
            >
                Email <span class="required">*</span>
            </label>

            <input
                class="form-input"
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                autocomplete="email"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label
                class="form-label"
                for="password"
            >
                Password <span class="required">*</span>
            </label>

            <input
                class="form-input"
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="6"
                required
            >

            <p class="password-message">
                Your password must contain at least 6 characters.
            </p>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

            <label
                class="form-label"
                for="confirm-password"
            >
                Confirm Password <span class="required">*</span>
            </label>

            <input
                class="form-input"
                type="password"
                id="confirm-password"
                name="confirm-password"
                placeholder="Enter your password again"
                autocomplete="new-password"
                required
            >

        </div>


        <!-- AGREEMENT -->

        <div class="agreement">

            <input
                type="checkbox"
                id="agreement"
                required
            >

            <label for="agreement">

                I agree to MYP Haven's
                <a href="#" onclick="return false;">
                    Terms
                </a>
                and
                <a href="#" onclick="return false;">
                    Privacy Policy
                </a>.

            </label>

        </div>


        <!-- ERROR -->

        <div
            class="error-message"
            id="error-message"
            role="alert"
        ></div>


        <!-- SUCCESS -->

        <div
            class="success-message"
            id="success-message"
            role="status"
        ></div>


        <!-- CREATE ACCOUNT -->

        <button
            class="create-button"
            id="create-button"
            type="submit"
        >
            Create Account
        </button>


        <!-- DIVIDER -->

        <div class="divider">

            <div class="divider-line"></div>

            <span class="divider-text">
                OR
            </span>

            <div class="divider-line"></div>

        </div>


        <!-- LOGIN -->

        <button
            class="login-button"
            id="login-button"
            type="button"
        >
            Already have an account? Log in
        </button>


    </form>

</main>


<!-- =====================================================
     FIREBASE
====================================================== -->

<script type="module">

    /* =================================================
       FIREBASE IMPORTS
    ================================================= */

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
        getAuth,
        createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    import {
        getFirestore,
        doc,
        setDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    /* =================================================
       FIREBASE CONFIGURATION
    ================================================= */

    const firebaseConfig = {

        apiKey:
            "AIzaSyBNI4CR26Re0xdh-T0XdVyb6fFN7SPgPNA",

        authDomain:
            "the-myp-haven.firebaseapp.com",

        projectId:
            "the-myp-haven",

        storageBucket:
            "the-myp-haven.firebasestorage.app",

        messagingSenderId:
            "904577455533",

        appId:
            "1:904577455533:web:1d918ee8a3caa547eefd24"

    };


    /* =================================================
       INITIALIZE FIREBASE
    ================================================= */

    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);


    /* =================================================
       ELEMENTS
    ================================================= */

    const form =
        document.getElementById(
            "create-account-form"
        );

    const fullNameInput =
        document.getElementById(
            "full-name"
        );

    const emailInput =
        document.getElementById(
            "email"
        );

    const passwordInput =
        document.getElementById(
            "password"
        );

    const confirmPasswordInput =
        document.getElementById(
            "confirm-password"
        );

    const agreement =
        document.getElementById(
            "agreement"
        );

    const createButton =
        document.getElementById(
            "create-button"
        );

    const loginButton =
        document.getElementById(
            "login-button"
        );

    const errorMessage =
        document.getElementById(
            "error-message"
        );

    const successMessage =
        document.getElementById(
            "success-message"
        );


    /* =================================================
       SHOW ERROR
    ================================================= */

    function showError(message) {

        errorMessage.textContent =
            message;

        errorMessage.classList.add(
            "show"
        );

        successMessage.classList.remove(
            "show"
        );

    }


    /* =================================================
       SHOW SUCCESS
    ================================================= */

    function showSuccess(message) {

        successMessage.textContent =
            message;

        successMessage.classList.add(
            "show"
        );

        errorMessage.classList.remove(
            "show"
        );

    }


    /* =================================================
       CLEAR MESSAGES
    ================================================= */

    function clearMessages() {

        errorMessage.textContent = "";

        errorMessage.classList.remove(
            "show"
        );

        successMessage.textContent = "";

        successMessage.classList.remove(
            "show"
        );

    }


    /* =================================================
       FIREBASE ERROR TRANSLATION
    ================================================= */

    function getFriendlyError(errorCode) {

        switch (errorCode) {

            case "auth/email-already-in-use":

                return "An account with this email already exists. Try logging in instead.";


            case "auth/invalid-email":

                return "Please enter a valid email address.";


            case "auth/weak-password":

                return "Your password is too weak. Please use at least 6 characters.";


            case "auth/network-request-failed":

                return "There was a network problem. Please check your internet connection and try again.";


            case "auth/operation-not-allowed":

                return "Email and password accounts have not been enabled in Firebase yet.";


            default:

                return "Something went wrong while creating your account. Please try again.";

        }

    }


    /* =================================================
       CREATE ACCOUNT
    ================================================= */

    form.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();

            clearMessages();


            const fullName =
                fullNameInput.value.trim();

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;


            /* -----------------------------------------
               VALIDATION
            ----------------------------------------- */

            if (!fullName) {

                showError(
                    "Please enter your full name."
                );

                fullNameInput.focus();

                return;
            }


            if (!email) {

                showError(
                    "Please enter your email address."
                );

                emailInput.focus();

                return;
            }


            if (password.length < 6) {

                showError(
                    "Your password must contain at least 6 characters."
                );

                passwordInput.focus();

                return;
            }


            if (
                password !==
                confirmPassword
            ) {

                showError(
                    "The passwords do not match."
                );

                confirmPasswordInput.focus();

                return;
            }


            if (!agreement.checked) {

                showError(
                    "Please agree to the Terms and Privacy Policy before creating your account."
                );

                agreement.focus();

                return;
            }


            /* -----------------------------------------
               LOADING STATE
            ----------------------------------------- */

            createButton.disabled = true;

            createButton.innerHTML = `
                <span class="loading">
                    <span class="spinner"></span>
                    Creating Account...
                </span>
            `;


            try {

                /* -------------------------------------
                   CREATE FIREBASE AUTH ACCOUNT
                ------------------------------------- */

                const userCredential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    userCredential.user;


                /* -------------------------------------
                   SAVE STUDENT INFORMATION
                ------------------------------------- */

                await setDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    ),
                    {

                        fullName:
                            fullName,

                        email:
                            user.email,

                        uid:
                            user.uid,

                        createdAt:
                            serverTimestamp(),

                        profileComplete:
                            false,

                        surveyComplete:
                            false

                    }
                );


                /* -------------------------------------
                   SUCCESS
                ------------------------------------- */

                showSuccess(
                    "Your account has been created! Taking you to the quick survey..."
                );


                createButton.innerHTML =
                    "Account Created ✓";


                /* -------------------------------------
                   GO TO SURVEY
                ------------------------------------- */

                setTimeout(() => {

                    window.location.href =
                        "survey.html";

                }, 1200);


            } catch (error) {

                console.error(
                    "Firebase account creation error:",
                    error
                );


                showError(
                    getFriendlyError(
                        error.code
                    )
                );


                createButton.disabled =
                    false;

                createButton.textContent =
                    "Create Account";

            }

        }
    );


    /* =================================================
       LOGIN BUTTON
    ================================================= */

    loginButton.addEventListener(
        "click",
        () => {

            window.location.href =
                "login.html";

        }
    );


</script>
